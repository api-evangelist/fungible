name: Fungible
description: >-
  Fungible Inc. was a Santa Clara, California startup founded in 2015 by Pradeep
  Sindhu (Juniper Networks co-founder) and Bertrand Serlet that built Data
  Processing Units (DPUs) — programmable microprocessors (the F1 and S1 chips
  plus the FS1600 NVMe storage array) designed to offload networking, storage,
  and security workloads from data-center CPUs. Its DPU cluster control plane ran
  Linux and exposed internal REST APIs for management, but Fungible never
  published a public developer API, developer portal, or SDK registry. Microsoft
  acquired the company in January 2023 (reported ~$190M), folded the team into its
  Azure data-center infrastructure engineering organization, and wound down the
  independent product line. The fungible.com domain no longer resolves and there
  is no live public API surface to enrich.
